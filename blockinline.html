<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>block and inline level elements</title>
</head>
<body>
    <!-- block level elements -->
     <div>my name is dhanya</div>
     <p>studying in hkbk college of engineering</p>
     <p>located in manyata tech park bangalore</p>
     <!-- inline level elements -->
    <span>i love you</span>
    <span>john</span>
    <a href="https://www.love.com">click here</a>
</body>
</html>
