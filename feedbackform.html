<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>

    <h2>Website Feedback Form</h2>
    
    <!-- Replace 'your-backend-endpoint' with your actual form processing URL -->
    <form action="your-backend-endpoint" method="POST">
        
        <!-- Name Field -->
        <div>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" required placeholder="John Doe">
        </div>
        <br>

        <!-- Email Field -->
        <div>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required placeholder="john@example.com">
        </div>
        <br>

        <!-- Rating Dropdown -->
        <div>
            <label for="rating">How would you rate your experience?</label><br>
            <select id="rating" name="rating">
                <option value="excellent">Excellent</option>
                <option value="good">Good</option>
                <option value="average" selected>Average</option>
                <option value="poor">Poor</option>
            </select>
        </div>
        <br>

        <!-- Comments Textarea -->
        <div>
            <label for="comments">Your Feedback:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="40" required placeholder="Type your suggestions here..."></textarea>
        </div>
        <br>

        <!-- Submit Button -->
        <div>
            <button type="submit">Submit Feedback</button>
        </div>

    </form>

</body>
</html>
