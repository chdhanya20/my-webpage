<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>attribute selectors</title>
    <style>
        [target]{
            color:darkorange;
        }

        [target="_top"]{
            color:blue;
        }
    </style>
</head>
<body>
    <a href="https://www.flipkart.com" target="_blank">flipkart</a>
    <a href="https://www.amazon.com" target="_top">amazon</a>
</body>
</html>
