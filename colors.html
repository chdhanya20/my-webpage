<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors</title>
    <style>
        h1{
            color:white;
            background-color: red;
        }
        h2{
            color:rgb(0,255,0);
            background-color: rgb(0,0,0);
        }

        h3{
            color:rgba(0,0,255,0.8);
            background-color: rgba(99, 79, 79,1);
        }
        
        h4{
            color:hsl(180,100%,50%);
            background-color: hsl(39, 40%, 50%);
        }

        h5{
            color:hsla(300, 100%, 50%, 0.8);
            background-color:hsla(60, 100%, 50%,1);
        }
        h6{
            color:#00ff00;
            background-color: #7d5c09;
        }
        
    </style>
</head>
<body>
    <h1>Hi I am dhanya</h1>
    <h2>I love myself</h3>
    <h3>I have joined pentagon space for java full stack course</h3>
    <h4>My hobbies are dancing,playing badminton</h4>
    <h5>My skills are html,css,java,python and sql</h5>
    <h6>thank you bye</h6>
</body>
</html>
